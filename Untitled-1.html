<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple E-commerce Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px;
    }
    .product {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 10px;
      width: 200px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .product img {
      max-width: 100%;
      height: 150px;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .product button {
      background: #28a745;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .cart {
      background: #fff3cd;
      padding: 15px;
      margin: 20px;
      border: 1px solid #ffeeba;
      border-radius: 8px;
    }
    .cart h2 {
      margin-top: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>🛍️ My E-commerce Website</h1>
</header>

<section class="products">
  <div class="product">
    <img src="https://via.placeholder.com/150" alt="Product 1">
    <h3>Product 1</h3>
    <p>₹500</p>
    <button onclick="addToCart('Product 1', 500)">Add to Cart</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/150" alt="Product 2">
    <h3>Product 2</h3>
    <p>₹750</p>
    <button onclick="addToCart('Product 2', 750)">Add to Cart</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/150" alt="Product 3">
    <h3>Product 3</h3>
    <p>₹1200</p>
    <button onclick="addToCart('Product 3', 1200)">Add to Cart</button>
  </div>
</section>

<section class="cart">
  <h2>🛒 Shopping Cart</h2>
  <ul id="cartItems"></ul>
  <p><strong>Total: ₹<span id="total">0</span></strong></p>
</section>

<script>
  let cart = [];
  let total = 0;

  function addToCart(product, price) {
    cart.push({product, price});
    total += price;
    displayCart();
  }

  function displayCart() {
    const cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";
    cart.forEach(item => {
      let li = document.createElement("li");
      li.textContent = `${item.product} - ₹${item.price}`;
      cartItems.appendChild(li);
    });
    document.getElementById("total").textContent = total;
  }
</script>

</body>
</html>
